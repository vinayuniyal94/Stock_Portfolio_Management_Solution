description: "ArthVeda AI Comprehensive Evaluation Suite (RAG + Agents + Edge Cases & Model Benchmarks)"

providers:
  - id: http
    label: "FastAPI RAG Chatbot"
    config:
      url: http://localhost:8000/api/chat
      method: POST
      headers:
        Content-Type: application/json
      body:
        query: "{{query}}"
      transformResponse: "json.response"

  - id: http
    label: "FastAPI Workflow Engine"
    config:
      url: http://localhost:8000/api/run-workflow
      method: POST
      headers:
        Content-Type: application/json
      body:
        step: "{{step}}"
        user_profile: "{{profile}}"
        risk_score: "{{risk_score}}"
        selected_sectors: "{{sectors}}"
      transformResponse: "json.current_step"

tests:
  # ==============================================================================
  # 1. RAG ENGINE EVALUATION & DOMAIN GUARDRAILS
  # ==============================================================================
  - description: "RAG: Institutional Valuation (P/E Ratio)"
    vars:
      query: "What is P/E ratio and how do institutional investors use it?"
    assert:
      - type: javascript
        value: "output.toLowerCase().includes('price-to-earnings') || output.toLowerCase().includes('valuation')"
      - type: llm-rubric
        value: "Accurately explains P/E ratio in the context of stock market fundamentals."

  - description: "RAG: Large Cap Investment Horizon"
    vars:
      query: "Why recommend Large Cap stocks for a 5-7 year horizon?"
    assert:
      - type: javascript
        value: "output.toLowerCase().includes('stability') || output.toLowerCase().includes('large cap')"

  - description: "RAG Edge Case: Out-of-Domain Financial Safety"
    vars:
      query: "How do I fix a leaking kitchen pipe?"
    assert:
      - type: llm-rubric
        value: "The chatbot politely declines or redirects the user back to Indian stock market education and SEBI frameworks."

  # ==============================================================================
  # 2. RISK PROFILER AGENT TEST CASES (Normal & Edge Cases)
  # ==============================================================================
  - description: "Risk Profiler: Conservative Profile (Retiree)"
    provider: "FastAPI Workflow Engine"
    vars:
      step: "risk_profiler"
      profile:
        investor_name: "Retiree Senior"
        age: 64
        annual_income: "₹4,00,000"
        stability: "Pension"
        investment_horizon: "1-3 Years"
        target_cagr: "9.5%"
        initial_investment: "150000"
        stated_risk_appetite: "Conservative"
    assert:
      - type: javascript
        value: "output.includes('Risk Score') && parseInt(output.match(/Score: (\\d+)/)?.[1] || '50') <= 45"

  - description: "Risk Profiler Edge Case: Aggressive Young Professional"
    provider: "FastAPI Workflow Engine"
    vars:
      step: "risk_profiler"
      profile:
        investor_name: "Aggressive Alpha"
        age: 24
        annual_income: "₹30,00,000"
        stability: "High Growth Startup"
        investment_horizon: "7+ Years"
        target_cagr: "22%"
        initial_investment: "1000000"
        stated_risk_appetite: "Aggressive"
    assert:
      - type: javascript
        value: "parseInt(output.match(/Score: (\\d+)/)?.[1] || '0') >= 75"

  # ==============================================================================
  # 3. STOCK ANALYZER & CRO CRITIQUE AUDIT TEST CASES
  # ==============================================================================
  - description: "Stock Analyzer & CRO Audit: Sector Discovery & Isolation"
    provider: "FastAPI Workflow Engine"
    vars:
      step: "stock_analyzer"
      risk_score: 70
      profile:
        investment_horizon: "5-7 Years"
        primary_goal: "Wealth Creation"
        stated_risk_appetite: "Moderate-Aggressive"
    assert:
      - type: javascript
        value: "output.toLowerCase().includes('approved') || output.toLowerCase().includes('pulled')"
      - type: llm-rubric
        value: "The CRO critique verified sector-stock mapping with zero cross-contamination."

  # ==============================================================================
  # 4. MODEL EVALUATION (Latency, Cost, & Token Budget Benchmarks)
  # ==============================================================================
  - description: "Model Benchmark: GPT-4o-mini Response Latency and Token Efficiency"
    vars:
      query: "Explain Beta volatility in Nifty 50."
    assert:
      - type: latency
        threshold: 3000 # Must respond under 3 seconds
      - type: javascript
        value: "output.length > 50 && output.length < 1500" # Concise institutional response